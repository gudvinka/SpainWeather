# SpainWeather: кадры камер, данные станций и Open-Meteo, затем коммит данных в репозиторий.
# Запускает Cloudflare Worker spainweather-cron 3 раза в день (cloudflare/worker.js); своего расписания нет —
# расписание GitHub опаздывало на часы и давало лишние, в том числе ночные, сборы.
name: snap

on:
  workflow_dispatch: # «Run workflow»: Cloudflare Worker по расписанию или кнопка для ручного запуска
    inputs:
      force:
        description: 'Собрать всё равно, даже если зелёный сбор был меньше 30 минут назад'
        type: boolean
        default: false

permissions:
  contents: write # бот коммитит новые данные
  actions: read # защита от дублей смотрит прошлые запуски snap

concurrency:
  group: snap # два запуска не пушат одновременно
  cancel-in-progress: false

jobs:
  # Защита от дублей: Cloudflare изредка запускает cron дважды (22.11.2026 — в 14:00:11 и 14:00:38). Второй запуск ждёт
  # первого (concurrency выше) и пропускает сбор, если меньше 30 минут назад был ЗЕЛЁНЫЙ snap. После красного (не ответил
  # AEMET, Open-Meteo, не сохранились данные) — собирает заново. Пропущенный запуск — зелёный, сбор в нём «skipped».
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.recent.outputs.skip }}
    steps:
      - name: Был ли зелёный сбор за последние 30 минут
        id: recent
        if: ${{ !inputs.force }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '30 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow snap.yml --status success --created ">=$since" --json databaseId --jq 'length') || n=0  # проверка сломалась — собираем как обычно
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice::Зелёный сбор уже был после $since UTC — это дубль, сбор пропущен"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

  snap:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Madrid # на серверах UTC — без этого поедут даты и проверка «станция отстаёт»
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check

      - name: Собрать данные
        id: snap
        run: node src/snap.ts
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }} # основная станция Овьедо (AEMET OpenData)
        continue-on-error: true # что удалось собрать, сохраняем даже при ошибке одного источника

      - name: Сохранить данные
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site index.html
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push

      - name: Отметить запуск красным, если были ошибки
        if: steps.snap.outcome == 'failure'
        run: exit 1
